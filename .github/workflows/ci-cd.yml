name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Maven wrapper executable (Linux CI)
        run: chmod +x mvnw

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (Vite → Spring static)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Maven test
        env:
          MAVEN_OPTS: -Xmx2048m
          LANG: C.UTF-8
        run: ./mvnw -B --no-transfer-progress test -Pci

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: docker build -t student:ci .

  deploy:
    needs: [build-and-test, docker-image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set, skipping deploy hook"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" -o /dev/null

      - name: Health check (production)
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL not set, skipping health check"
            exit 0
          fi
          set -e
          BASE="${DEPLOY_URL%/}"
          for i in $(seq 1 24); do
            if curl -fsS "$BASE/actuator/health" | grep -q '"status":"UP"'; then
              echo "Health OK"
              exit 0
            fi
            echo "Attempt $i: not ready, sleep 10s"
            sleep 10
          done
          echo "Health check failed"
          exit 1
