name: CI/CD Pipeline

on:
  push:
    branches: ["master"]

env:
  IMAGE_NAME: alesya199/student

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build project
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests -Dcheckstyle.skip

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw test -Dcheckstyle.skip

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Push image
        run: docker push $IMAGE_NAME:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check app health
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          for i in {1..20}; do
            if curl -fsS "$DEPLOY_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting..."
            sleep 10
          done
          echo "App is NOT healthy"
          exit 1
