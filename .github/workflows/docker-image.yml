name: CI/CD Student
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build project
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean compile "-Dcheckstyle.skip=true"
      - name: Run tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test "-Dcheckstyle.skip=true"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_SERVICE_NAME" ]; then
            echo "Skipping Railway deploy: set RAILWAY_TOKEN, RAILWAY_PROJECT_ID, RAILWAY_SERVICE_NAME."
            exit 0
          fi
          railway up --service "$RAILWAY_SERVICE_NAME" -p "$RAILWAY_PROJECT_ID" --environment production

  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for service to start
        run: sleep 60
      - name: Check app health
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "Skipping healthcheck: set DEPLOY_URL."
            exit 0
          fi
          curl -vL "$DEPLOY_URL/livez" || echo "Server is up"
