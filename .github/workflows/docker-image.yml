name: CI/CD Pipeline
on:
  push:
    branches: ["master"]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build project
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests "-Dcheckstyle.skip=true"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test "-Dcheckstyle.skip=true"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.RAILWAY_TOKEN != '' && secrets.RAILWAY_PROJECT_ID != '' && secrets.RAILWAY_ENVIRONMENT_NAME != '' && secrets.RAILWAY_SERVICE_NAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci --service "${{ secrets.RAILWAY_SERVICE_NAME }}" --environment "${{ secrets.RAILWAY_ENVIRONMENT_NAME }}" --project "${{ secrets.RAILWAY_PROJECT_ID }}"

  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ secrets.DEPLOY_URL != '' }}
    steps:
      - name: Check app health
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          for i in {1..20}; do
            if curl -fsS "$DEPLOY_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting..."
            sleep 10
          done
          echo "App is NOT healthy"
          exit 1
