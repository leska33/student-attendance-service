spring.application.name=Student
server.port=${PORT:${SERVER_PORT:8080}}
# Bind on all interfaces (some PaaS / Docker setups expect this for inbound health checks).
server.address=0.0.0.0

# Do not reference DATABASE_URL / SPRING_DATASOURCE_URL here (postgresql:// breaks Hikari). Those are normalized in DatasourceEnvPostProcessor into DEPLOY_DATASOURCE_JDBC_URL / spring.datasource.url.
spring.datasource.url=${DEPLOY_DATASOURCE_JDBC_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:studentdb}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:${POSTGRES_USER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Expose /livez and /readyz on the main server port (Spring Boot 4 + Railway/K8s-style probes).
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.show-details=never
